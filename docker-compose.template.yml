services:
  php:
    # Built from the Dockerfile that `compose` renders from Dockerfile.template,
    # using the PHP version from PHP_VERSION in the project's .env file
    build:
      context: .
      dockerfile: Dockerfile
    # Tagged with a checksum of the Dockerfile: `docker compose up -d` only builds
    # (and recreates the container) when the Dockerfile changes
    image: ${COMPOSE_PROJECT_NAME}-php:${IMAGE_TAG}
    container_name: ${NAME:-frankenphp}
    # Force the container to run as your local user & group ID
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Change the default container working directory
    working_dir: ${DATA_VOLUME}
    volumes:
      # 1. Your application code mapped to the custom path
      - .:${DATA_VOLUME}
      
      # 2. Bind mounts to keep SSL certs and config visible in your project root
      - ./.caddy/data:/data
      - ./.caddy/config:/config
      
      # 3. Mount your custom site configuration file directly into Caddy
      - ./Caddyfile:/etc/frankenphp/Caddyfile

      # 4. Mount the generated SSL certs into the container
      - ./.caddy/certs:/etc/caddy/certs:ro
    environment:
      # Pass the variables into the container environment so Caddy can use it
      - DATA_VOLUME=${DATA_VOLUME}
      # Folder whose public/ is served; `bash bash/reload` switches it per release
      - APP_ROOT=${APP_ROOT}
      - SERVER_NAME=${SERVER_NAME}
      - NAME=${NAME}
    restart: unless-stopped
